<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Menu</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body style="opacity:0">


<div class="app no-nav">

  <main class="content">

    <div class="menu">

      <!-- LEVELS PATH -->
      <div class="path"></div>

        <!-- LEVELS (ALL LEVELS LIVE HERE) -->
        <div class="levels">

          <div class="level"><img src="lock.svg"></div>
          <div class="level"><img src="lock.svg"></div>
          <div class="level"><img src="lock.svg"></div>
          <div class="level"><img src="lock.svg"></div>

          <div class="level current" onclick="startLevel(0)">
            <img src="coin.svg">
            <span class="level-number">1</span>
          </div>

        </div>

      <!-- DINO -->
      <img class="dino" src="nofffa1.svg">

      <!-- SPEECH -->
<div class="speech" id="speech"></div>

    </div>
  </main>





</div>



<script>
function getLang() {
  const params = new URLSearchParams(window.location.search);
  return (params.get("lang") || "pt").toLowerCase();
}

function startLevel(levelIndex) {
  const lang = getLang();
  document.body.classList.add("fade-out");
  setTimeout(() => {
    window.location.href = `app.html?level=${levelIndex}&screen=0&lang=${lang}`;
  }, 300);
}

function goHome() {
  window.location.href = "index.html";
}

function setProgress() {
  const levels = document.querySelectorAll(".level");
  levels.forEach(level => level.classList.remove("current"));
  // Level 1 (last one) is current at the beginning
  if (levels[levels.length - 1]) {
    levels[levels.length - 1].classList.add("current");
  }
}

function setSpeech() {
  const lang = getLang();
  const speech = document.getElementById("speech");
  const text = {
    pt: `Vem-findo! <br>Pronto para comefar?<br>Clica no nível 1!`,
    en: `Welcome! <br>Ready to start?<br>Tap level 1!`
  };
  speech.innerHTML = text[lang] || text.pt;
}


// CHECK SAVED PROGRESS AND SKIP TO CORRECT MENU
const savedLevel = parseInt(localStorage.getItem("maxUnlockedLevel") ?? "0", 10);
if (savedLevel >= 1) {
  const _lang = new URLSearchParams(window.location.search).get("lang") || "pt";
  window.location.replace(`menu0${savedLevel + 1}.html?lang=${_lang}`);
} else {
  document.body.style.opacity = "1";
}

// INIT
setSpeech();
setProgress();

setSpeech();
setProgress();
history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
});

</script>





</body>
</html>
