<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Mind App</title>

  <!-- LINK CSS FILE -->
<link rel="stylesheet" id="main-stylesheet" href="style.css" />
</head>

<body style="opacity:0">




  <!-- MAIN APP CONTAINER -->
  <div class="app">




<!-- SIZE CONTROLS -->
<!-- CONTENT AREA -->
<main class="content" id="content"></main>

<div class="controls-bar">
  <div class="size-controls">
    <button class="size-btn" onclick="changeSize(-1)">A−</button>
    <button class="size-btn" onclick="changeSize(1)">A+</button>
  </div>
  <!-- LEVEL INDICATOR -->
  <div class="level-indicator" id="level-indicator"></div>

</div>

<!-- PROGRESS BAR -->
<div class="progress-container">
  <div class="progress-bar"></div>
</div>



    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav" id="bottomNav">
      <img class="nav-bg" id="nav-bg" src="three-buttons-locked.svg" alt="">

      <button class="nav-btn back-btn">
        <img src="left.svg" alt="Previous">
      </button>

      <button class="nav-btn home-btn" onclick="goHome()">
        <img src="home.svg" alt="Home">
      </button>

      <button class="nav-btn hub-btn" id="hub-btn" onclick="goToHub()">
        <img src="all-levels.svg" class="all-levels-icon" alt="All Levels">
      </button>

      <button class="nav-btn next-btn">
        <img src="right.svg" alt="Next">
      </button>
    </nav>

  </div>











<script>
window.addEventListener("load", async () => {
  const contentArea = document.getElementById("content");
  const bar = document.querySelector(".progress-bar");
  const progressContainer = document.querySelector(".progress-container");
  if (!contentArea || !bar) return;

  const params = new URLSearchParams(window.location.search);
  // 1. CHANGED TO 'let' SO WE CAN UPDATE IT LATER
  let lang = (params.get("lang") || "pt").toLowerCase();
  const fromHub = params.get("from") === "hub";

  if (fromHub) {
    document.getElementById("bottomNav").classList.add("has-hub");
    document.getElementById("nav-bg").src = "three-buttons-locked.svg";
  }

  const res = await fetch("data.json?t=" + Date.now());
  const data = await res.json();
  const levels = data.levels;

  let levelIndex = parseInt(params.get("level") ?? "0", 10);
  if (!levels[levelIndex]) levelIndex = 0;

  let current = parseInt(params.get("screen") ?? "0", 10);

  const backBtn = document.querySelector(".bottom-nav img[alt='Previous']").closest("button");
  const nextBtn = document.querySelector(".bottom-nav img[alt='Next']").closest("button");
  const bottomNav = document.getElementById("bottomNav");



  // 2. ADDED LANGUAGE SWITCHER LOGIC
window.switchLang = (newLang) => {
    lang = newLang;

    // UPDATE TOGGLE POSITION
    const toggle = document.getElementById('lang-toggle');
    if (toggle) toggle.classList.toggle('en', lang === 'en');

    // UPDATE URL WITHOUT REFRESHING PAGE
    const newUrl = new URL(window.location);
    newUrl.searchParams.set('lang', lang);
    window.history.replaceState({}, '', newUrl);

    // RE-RENDER THE CURRENT SCREEN WITH NEW LANGUAGE
    render(current);
  };

  // SINGLE TOGGLE FUNCTION — FLIPS BETWEEN PT AND EN ON CLICK
  window.toggleLang = () => {
    switchLang(lang === 'pt' ? 'en' : 'pt');
  };


  function render(i) {
    current = i;
    window.scrollTo(0, 0);
    const level = levels[levelIndex];
    const screen = level[i];
    const screenId = screen?.SCREEN_ID;

    contentArea.classList.remove("l4-s21-layout", "image-after-title", "win-screen");
    contentArea.classList.toggle("lang-en", lang === "en"); /* ADDS BLUE TINT CLASS 

    WHEN ENGLISH IS ACTIVE */
    if (screenId === "L4_S21") contentArea.classList.add("l4-s21-layout");

    // Pulls from screen[lang] dynamically (pt or en)
    const content = screen?.[lang]?.content || screen?.content || [];
    contentArea.classList.add("fade-out");

    setTimeout(() => {
      contentArea.innerHTML = "";

      if (screenId === "L4_S19") {
        contentArea.classList.add("win-screen");
bottomNav.style.display = "none";
progressContainer.style.display = "none";
document.querySelector(".controls-bar").style.display = "none"; // HIDE CONTROLS ON WIN SCREEN


        content.forEach(block => {
          let el;
          if (block.type === "image" && block.value) {
            el = document.createElement("img");
            el.src = block.value + "?v=" + Date.now();
            if (block.class) el.classList.add(block.class);
          }
          if (el) contentArea.appendChild(el);
        });

        contentArea.classList.remove("fade-out");

        setTimeout(() => {
          document.body.style.transition = "opacity 0.8s ease";
          document.body.style.opacity = "0";
          setTimeout(() => {
            window.location.href = "menu05.html?lang=" + lang;
          }, 800);
        }, 6000);

        return;
      }

document.getElementById("level-indicator").innerText = lang === "pt" ? `Nível ${levelIndex + 1}` : `Level ${levelIndex + 1}`;

      const TITLE_DELAY  = 0.1;
      const STAGGER_STEP = 0.22;
      let animDelay = TITLE_DELAY;

      content.forEach(block => {
        let el;
        if (block.type === "title") {
          el = document.createElement("h1");
          el.innerHTML = block.value;
          if (block.style === "highlight") el.classList.add("special-title");
          el.classList.add("anim-title");
          el.style.animationDelay = TITLE_DELAY + "s";
          animDelay = TITLE_DELAY + STAGGER_STEP;
        }
        else if (block.type === "text") {
          el = document.createElement("p");
          el.innerHTML = block.value;
          if (block.class) el.classList.add(block.class);
          if (block.value) {
            el.classList.add("anim-text");
            el.style.animationDelay = animDelay + "s";
            animDelay += STAGGER_STEP;
          }
        }
        else if (block.type === "image" && block.value) {
          el = document.createElement("img");
          el.src = block.value + "?v=" + Date.now();
          if (block.class) el.classList.add(block.class);
          el.classList.add("anim-img");
          el.style.animationDelay = animDelay + "s";
          animDelay += STAGGER_STEP;
        }
        if (el) contentArea.appendChild(el);
      });

      progressContainer.style.display = "block";
      bar.style.width = ((i + 1) / levels[levelIndex].length) * 100 + "%";

      const isHub = bottomNav.classList.contains("has-hub");
      const navBg = document.getElementById("nav-bg");
      const isLastScreen = i === level.length - 1;

if (isHub) {
  if (i === 0) {
    bottomNav.classList.remove("last-screen");
    backBtn.style.display = "flex";
    backBtn.style.visibility = "hidden";
    nextBtn.style.display = "flex";
    nextBtn.style.visibility = "visible";
    navBg.src = "two-button-locked-forward.svg";
  } else if (isLastScreen) {
    bottomNav.classList.remove("last-screen");
    backBtn.style.display = "flex";
    backBtn.style.visibility = "visible";
    nextBtn.style.display = "flex";           /* WAS "NONE" — NOW VISIBLE ON LAST SCREEN */
    nextBtn.style.visibility = "visible";
    navBg.src = "three-buttons-locked.svg";   /* FIXED TYPO: WAS "three-button-locked.svg" */
  } else {
    bottomNav.classList.remove("last-screen");
    backBtn.style.display = "flex";
    backBtn.style.visibility = "visible";
    nextBtn.style.display = "flex";
    nextBtn.style.visibility = "visible";
    navBg.src = "three-buttons-locked.svg";
  }
}

      contentArea.classList.remove("fade-out");
    }, 100);
  }

  backBtn.onclick = () => {
    if (current > 0) render(--current);
  };


function spawnEmojis(e) {
  const emojis = ["😄","🧠","⚡","🙂","💡","✨","🎯","💥", "🎉"];
  const count = 5;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "emoji-burst";
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    // SPREAD EMOJIS RANDOMLY AROUND THE TAP POINT
    el.style.left = (e.clientX + (Math.random() - 0.5) * 60) + "px";
    el.style.top  = (e.clientY + (Math.random() - 0.5) * 40) + "px";
    el.style.animationDelay = (Math.random() * 0.15) + "s";
    document.body.appendChild(el);
    // REMOVE FROM DOM AFTER ANIMATION ENDS
    setTimeout(() => el.remove(), 1200);
  }
}

nextBtn.onclick = (e) => {
  spawnEmojis(e);


    const level = levels[levelIndex];
    if (current < level.length - 1) {
      render(++current);
      return;
    }
    /* WHEN REVISITING FROM HUB — ALWAYS RETURN TO MENU05, NOT NEXT LEVEL */
    if (fromHub) {
      window.location.href = "menu05.html?lang=" + lang;
      return;
    }
const nextLevel = levelIndex + 1;
    // SAVE HIGHEST COMPLETED LEVEL TO BROWSER MEMORY
    const currentMax = parseInt(localStorage.getItem("maxUnlockedLevel") ?? "0", 10);
    if (nextLevel > currentMax) {
      localStorage.setItem("maxUnlockedLevel", nextLevel);
    }
    if (nextLevel < levels.length) {
      window.location.href = `menu0${nextLevel + 1}.html?lang=${lang}`;
    } else {
      window.location.href = "menu05.html?lang=" + lang;
    }
  };


// SET INITIAL TOGGLE STATE OF LANGUAGE BUTTON ON PAGE LOAD
  const toggle = document.getElementById('lang-toggle');
  if (toggle && lang === 'en') toggle.classList.add('en');
  render(current);

  document.querySelector(".bottom-nav").style.opacity = "1";
  document.body.style.transition = "opacity 0.3s ease";
  document.body.style.opacity = "1";
});

history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
});

// SIZE CONTROL — STEPS THROUGH FONT AND IMAGE SIZES
// sizeStep can be: 0 (small), 1 (normal), 2 (large), 3 (x-large)
const fontSizes  = [13, 16, 19];   // HTML BASE FONT SIZE IN PX FOR EACH STEP — 3 LEVELS ONLY
const imgScales  = [0.75, 1, 1.25]; // IMAGE SCALE MULTIPLIER FOR EACH STEP — 3 LEVELS ONLY
let sizeStep = parseInt(localStorage.getItem("sizeStep") ?? "1", 10);

function applySize() {
  if (!document.getElementById("content")) return; // ONLY APPLY ON LEVEL SCREENS, NOT MENUS
  document.documentElement.style.fontSize = fontSizes[sizeStep] + "px";
  document.documentElement.style.setProperty("--img-scale", imgScales[sizeStep]);
}

window.changeSize = (direction) => {
  sizeStep = Math.min(2, Math.max(0, sizeStep + direction)); // MAX IS 2 — 3 LEVELS ONLY (0, 1, 2)
  localStorage.setItem("sizeStep", sizeStep);
  applySize();
};

applySize(); // APPLY SAVED SIZE ON PAGE LOAD

window.goHome = () => {
  window.location.href = "index.html";
};

window.goToHub = () => {
  const currentLang = new URLSearchParams(window.location.search).get("lang") || "pt";
  document.body.style.transition = "opacity 0.4s ease";
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = `menu05.html?lang=${currentLang}`;
  }, 400);
};
</script>




<script>
  // Force reload CSS during development
  document.getElementById("main-stylesheet").href = "style.css?v=" + Date.now();
</script>




<style>
/* EMOJI BURST — FLOATING PARTICLES ON NEXT BUTTON TAP */
.emoji-burst {
  position: fixed;
  font-size: 1.6rem;
  pointer-events: none;
  z-index: 9999;
  animation: emojiFly 1s ease-out forwards;
  user-select: none;
}

@keyframes emojiFly {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) scale(1.4); }
}
</style>


</body>
</html>
