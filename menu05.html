<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Parabéns</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body style="opacity:0">

<div class="app">

<main class="content" id="content">
  <div class="menu05-layout">
    <div class="menu05-cols">
<!-- LEFT COLUMN: TEXT + DINO -->
      <div class="menu05-right">
        <p class="menu05-text" id="congrats-text"></p>
        <div class="menu05-dino-wrap">
          <img class="menu05-img" id="dino-img" src="nofffa6.svg">
        </div>
      </div>
      <!-- RIGHT COLUMN: COIN BAR + LINKS BUTTON -->
      <div class="menu05-left">
        <div class="menu05-menu" id="levelMenu"></div>
        <button class="menu05-button" id="linksBtn"></button>
      </div>
    </div>
  </div>
</main>

<div class="menu05-lang-wrap">
  <div class="lang-toggle" id="lang-toggle" onclick="toggleLang()">
    <span class="toggle-label" id="label-pt">PT</span>
    <div class="toggle-knob"></div>
    <span class="toggle-label" id="label-en">ENG</span>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn home-btn" onclick="goHome()">
    <img src="home.svg" alt="Home">
  </button>
</nav>

<script>
const params = new URLSearchParams(window.location.search);
const lang = (params.get("lang") || "pt").toLowerCase();

// SWAPS DINO IMAGE BASED ON ACTIVE LANGUAGE
document.getElementById("dino-img").src = lang === "en" ? "nofffa6-ENG.svg" : "nofffa6.svg";

// CONGRATS TEXT
const text = {
  pt: "Parabéns por completar <br>esta leitura!<br><br>Aprender sobre a nossa saúde <br>é sempre tempo bem investido <br>e aumenta o nosso amor próprio!",
  en: "Congratulations on completing <br>this reading!<br><br>Learning about our health <br>is always time well invested <br>and increases our self-love!"
};
document.getElementById("congrats-text").innerHTML = text[lang] || text.pt;

// LINKS BUTTON
const btnText = { pt: "Links Úteis", en: "Useful Links" };
const linksBtn = document.getElementById("linksBtn");
linksBtn.innerText = btnText[lang] || btnText.pt;
linksBtn.onclick = () => {
  window.location.href = `menu06.html?lang=${lang}`;
};

/* HIDES LINKS BUTTON IN ENGLISH VERSION */
linksBtn.onclick = () => {
  window.location.href = `menu06.html?lang=${lang}`;
};
if (lang === "en") linksBtn.style.display = "none"; 


// LEVEL COINS (1–4)
const menu = document.getElementById("levelMenu");
[4, 3, 2, 1].forEach((n) => {
  const item = document.createElement("div");
  item.className = "menu05-level";

  const coinWrap = document.createElement("div");
  coinWrap.className = "menu05-coin-wrap";

  const coin = document.createElement("img");
  coin.src = "coin.svg";
  coin.className = "menu05-coin";

  const number = document.createElement("span");
  number.className = "menu05-level-number";
  number.innerText = n;

  coinWrap.appendChild(coin);
  coinWrap.appendChild(number);
  item.appendChild(coinWrap);

  item.onclick = () => {
    document.body.classList.add("fade-out");
    setTimeout(() => {
      window.location.href = `app.html?level=${n - 1}&lang=${lang}&from=hub`;
    }, 300);
  };

  menu.appendChild(item);
});

// TRAP BROWSER BACK/FORWARD — APP NAVIGATION HAS PRIORITY
history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
});

window.goHome = () => { window.location.href = "index.html"; };


document.body.style.transition = "opacity 0.3s ease";
document.body.style.opacity = "1";




window.closeApp = () => {
  window.close();
};


setSpeech();
setProgress();
history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
});

</script>


<script>
  // FORCES BROWSER TO RELOAD FRESH CSS — PREVENTS CACHED OLD STYLES
  document.querySelector('link[rel="stylesheet"]').href = "style.css?v=" + Date.now();



  // LANG TOGGLE
window.toggleLang = () => {
  const newUrl = new URL(window.location);
  newUrl.searchParams.set('lang', lang === 'pt' ? 'en' : 'pt');
  window.location.href = newUrl.toString();
};
const toggle = document.getElementById('lang-toggle');
if (toggle && lang === 'en') toggle.classList.add('en');

// SIZE CONTROLS
const fontSizes = [13, 16, 19];
const imgScales = [0.75, 1, 1.25];
let sizeStep = parseInt(localStorage.getItem("sizeStep") ?? "1", 10);
function applySize() {
  document.documentElement.style.fontSize = fontSizes[sizeStep] + "px";
  document.documentElement.style.setProperty("--img-scale", imgScales[sizeStep]);
}
window.changeSize = (direction) => {
  sizeStep = Math.min(2, Math.max(0, sizeStep + direction));
  localStorage.setItem("sizeStep", sizeStep);
  applySize();
};
applySize();

</script>


</body>
</html>
