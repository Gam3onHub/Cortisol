<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Links úteis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <main class="content menu05-screen">
    <h1 class="special-title">Links úteis</h1>
    <div class="links-box">
      <a href="https://saudemental.min-saude.pt" target="_blank">Portal Saúde Mental</a>
      <a href="https://www.sns24.gov.pt" target="_blank">SNS 24</a>
      <a href="https://ipdj.gov.pt/bem-estar-e-saude-mental" target="_blank">IPDJ - Bem-estar mental</a>
    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn home-btn" onclick="goBack()">
      <img src="left.svg" alt="Back">
    </button>
  </nav>
</div>
<script>
function goBack() {
  const params = new URLSearchParams(window.location.search);
  const lang = params.get("lang") || "pt";
  window.location.href = `menu05.html?lang=${lang}`;
}
history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
});
</script>
<script>
  document.querySelector('link[rel="stylesheet"]').href = "style.css?v=" + Date.now();
</script>
</body>
</html>
